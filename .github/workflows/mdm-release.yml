name: Sign MDM installer
run-name: Sign MDM installer ${{ github.ref_name }}

on:
  push:
    tags: ["20*.*.*", "mdm-bootstrap-20*.*.*"]
  pull_request:
    paths:
      - '.github/workflows/mdm-release.yml'
      - 'mdm/**'
      - 'cmd/mdm*.go'
      - 'cmd/mdm-bootstrap/**'
      - 'scripts/prepare-mdm-release.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: mdm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-preflight:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Build and inspect the unsigned universal installer
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-preflight"
          mkdir "$inputs"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" make build \
              BINARY="$inputs/doomer-$arch" VERSION=2099.1.1.1-beta.1
          done
          bootstrap_inputs="$inputs/bootstrap"
          bash mdm/build-bootstrap-binary.sh "$bootstrap_inputs"
          bash mdm/combine-binaries.sh "$inputs"
          # Release archives are extracted as data before the builder stages them.
          chmod 0644 "$inputs/doomer"
          DOOMER_MDM_BOOTSTRAP_VERSION=2099.1.1.1 \
            mdm/build-pkg.sh bootstrap "$bootstrap_inputs/doomer" codex,claude "$inputs/bootstrap.pkg"
          mdm/build-pkg.sh runtime "$inputs/doomer" codex,claude "$inputs/runtime.pkg"
          for kind in bootstrap runtime; do
            /usr/sbin/pkgutil --expand-full "$inputs/$kind.pkg" "$inputs/expanded-$kind"
            test -s "$inputs/expanded-$kind/Distribution"
            sudo /usr/sbin/installer -pkg "$inputs/$kind.pkg" -target /
          done
          test -f "$inputs/expanded-bootstrap/component.pkg/Payload/Library/DoomerMDM/installer-identity"
          /bin/launchctl print system/com.doomerlabs.doomer.mdm.update >/dev/null
          test ! -e /Library/DoomerMDM/bootstrap-doomer
          test "$(/usr/local/libexec/doomer-mdm/doomer mdm hook --agent codex)" = '{}'
          if /Library/DoomerMDM/run-doomer --version > "$inputs/pending" 2>&1; then
            echo "Bootstrap exposed a runtime before activation" >&2
            exit 1
          fi
          grep -F 'waiting for its first verified runtime' "$inputs/pending"
          /Library/DoomerMDM/incoming/doomer --version | grep -F 2099.1.1.1-beta.1
          test ! -e /Library/DoomerMDM/doomer
          if sudo /Library/DoomerMDM/run-doomer mdm update > "$inputs/guard" 2>&1; then
            echo "Updater accepted a non-MDM-enrolled macOS runner" >&2
            exit 1
          fi
          grep -F 'require active macOS MDM enrollment' "$inputs/guard"
          # Simulate activation to check that the same launcher now exposes Doomer.
          sudo /bin/mv /Library/DoomerMDM/incoming/doomer /Library/DoomerMDM/doomer
          /usr/local/libexec/doomer-mdm/doomer --version | grep -F 2099.1.1.1-beta.1

  sign:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 85
    environment: mdm-release
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag checkout
        run: |
          case "$GITHUB_REF_NAME" in
            mdm-bootstrap-*) scripts/verify-release-ref.sh --mdm-bootstrap ;;
            *) scripts/verify-release-ref.sh ;;
          esac
      - name: Check for an existing signed artifact
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"mdm-$GITHUB_REF_NAME\" and .expired == false) | .id")"
          if [[ -n "$artifact_ids" ]]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        if: steps.existing.outputs.reuse != 'true' && startsWith(github.ref_name, 'mdm-bootstrap-')
        with:
          go-version-file: go.mod
      - name: Build the independent bootstrap input
        if: steps.existing.outputs.reuse != 'true' && startsWith(github.ref_name, 'mdm-bootstrap-')
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mdm-artifact"
          bash mdm/build-bootstrap-binary.sh "$RUNNER_TEMP/mdm-inputs"
      - name: Verify published CLI inputs and combine architectures
        if: steps.existing.outputs.reuse != 'true' && !startsWith(github.ref_name, 'mdm-bootstrap-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          mkdir "$inputs" "$RUNNER_TEMP/mdm-artifact"
          for ((attempt=0; attempt<150; attempt++)); do
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$draft" == false ]]; then break; fi
            sleep 30
          done
          [[ "$draft" == false ]] || { echo "Timed out waiting for Depot's published Go CLI release" >&2; exit 1; }
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$inputs" \
            --pattern release-manifest.json --pattern "doomer_${GITHUB_REF_NAME}_darwin_*.tar.gz"
          python3 scripts/prepare-mdm-release.py "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$inputs"
          bash mdm/combine-binaries.sh "$inputs"
      - name: Sign and verify the macOS installer
        if: steps.existing.outputs.reuse != 'true'
        env:
          MDM_INSTALLER_P12_BASE64: ${{ secrets.MDM_INSTALLER_P12_BASE64 }}
          MDM_INSTALLER_P12_PASSWORD: ${{ secrets.MDM_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          if [[ "$GITHUB_REF_NAME" == mdm-bootstrap-* ]]; then
            version="${GITHUB_REF_NAME#mdm-bootstrap-}"
            DOOMER_MDM_BOOTSTRAP_VERSION="$version" mdm/sign-release-pkg.sh bootstrap "$inputs/doomer" \
              "$RUNNER_TEMP/mdm-artifact/Doomer-MDM-Bootstrap-$version.pkg"
          else
            mdm/sign-release-pkg.sh runtime "$inputs/doomer" "$RUNNER_TEMP/mdm-artifact/Doomer-MDM-$GITHUB_REF_NAME.pkg"
          fi
      - name: Record installer provenance
        if: steps.existing.outputs.reuse != 'true' && !startsWith(github.ref_name, 'mdm-bootstrap-')
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          package="$RUNNER_TEMP/mdm-artifact/Doomer-MDM-$GITHUB_REF_NAME.pkg"
          python3 scripts/prepare-mdm-release.py "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$inputs" \
            --record-package "$package" --runtime-only
      - name: Retain immutable installer for Depot
        if: steps.existing.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdm-${{ github.ref_name }}
          path: ${{ runner.temp }}/mdm-artifact/
          if-no-files-found: error
          retention-days: 90

  verify-package-signature:
    needs: sign
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.sign.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Verify a published signed package
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          version=2026.11.19.1-beta.4
          package="$RUNNER_TEMP/Doomer-MDM-$version.pkg"
          curl --fail --silent --show-error --max-time 60 \
            "https://downloads.doomer.ai/cli/releases/$version/Doomer-MDM-$version.pkg" \
            -o "$package"
          printf '%s  %s\n' a7c6d6f36a10a7a568b4ec28b0fb4a4d4c598f8d1abf9dd3915f17e1621daf89 "$package" \
            | /usr/bin/shasum -a 256 -c -
          /usr/bin/sw_vers
          DOOMER_TEST_MDM_RUNTIME="$package" \
            DOOMER_TEST_MDM_SIGNER='Developer ID Installer: Marc Campbell (SVB2S5YXF4)' \
            go test -v ./cmd -run '^TestMDMRealPackageSignature$'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'push'
        with:
          name: mdm-${{ github.ref_name }}
          path: ${{ runner.temp }}/mdm-artifact
      - name: Verify the signed release packages
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/mdm-artifact"
          if [[ "$GITHUB_REF_NAME" == mdm-bootstrap-* ]]; then
            version="${GITHUB_REF_NAME#mdm-bootstrap-}"
            pkg="$artifacts/Doomer-MDM-Bootstrap-$version.pkg"
            expanded="$RUNNER_TEMP/expanded-bootstrap"
            /usr/sbin/pkgutil --expand-full "$pkg" "$expanded"
            identity="$(cat "$expanded/component.pkg/Payload/Library/DoomerMDM/installer-identity")"
          else
            pkg="$artifacts/Doomer-MDM-$GITHUB_REF_NAME.pkg"
            # The signing job already compared this certificate to the signing keychain.
            identity="$(LC_ALL=C /usr/sbin/pkgutil --check-signature "$pkg" | sed -n 's/^[[:space:]]*1\. //p')"
          fi
          /usr/bin/sw_vers
          DOOMER_TEST_MDM_RUNTIME="$pkg" DOOMER_TEST_MDM_SIGNER="$identity" go test -v ./cmd -run '^TestMDMRealPackageSignature$'

  publish-bootstrap:
    needs: verify-package-signature
    if: github.event_name == 'push' && startsWith(github.ref_name, 'mdm-bootstrap-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mdm-${{ github.ref_name }}
          path: ${{ runner.temp }}/mdm-artifact
      - name: Publish the verified bootstrap package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mdm-artifact"
          version="${GITHUB_REF_NAME#mdm-bootstrap-}"
          pkg="Doomer-MDM-Bootstrap-$version.pkg"
          sha256sum "$pkg" > checksums.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            published="$(mktemp -d)"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$published"
            cmp "$pkg" "$published/$pkg"
            cmp checksums.txt "$published/checksums.txt"
            test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "Doomer MDM Bootstrap $version" "$pkg" checksums.txt
          fi
