name: Sign MDM installer
run-name: Sign MDM installer ${{ github.ref_name }}

on:
  push:
    tags: ["20*.*.*"]
  pull_request:
    paths:
      - '.github/workflows/mdm-release.yml'
      - 'mdm/**'
      - 'cmd/mdm*.go'

permissions:
  actions: read
  contents: read

concurrency:
  group: mdm-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package-preflight:
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Build and inspect the unsigned universal installer
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-preflight"
          mkdir "$inputs"
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" make build \
              BINARY="$inputs/doomer-$arch" VERSION=2099.1.1.1-beta.1
          done
          bash mdm/combine-binaries.sh "$inputs"
          for kind in bootstrap runtime; do
            mdm/build-pkg.sh "$kind" "$inputs/doomer" codex,claude "$inputs/$kind.pkg"
            /usr/sbin/pkgutil --expand "$inputs/$kind.pkg" "$inputs/expanded-$kind"
            test -s "$inputs/expanded-$kind/Distribution"
            sudo /usr/sbin/installer -pkg "$inputs/$kind.pkg" -target /
          done
          /bin/launchctl print system/com.doomerlabs.doomer.mdm.update >/dev/null
          /usr/local/libexec/doomer-mdm/doomer --version | grep -F 2099.1.1.1-beta.1
          /Library/DoomerMDM/incoming/doomer --version | grep -F 2099.1.1.1-beta.1
          test ! -e /Library/DoomerMDM/doomer
          if sudo /Library/DoomerMDM/run-doomer mdm update > "$inputs/guard" 2>&1; then
            echo "Updater accepted a non-MDM-enrolled macOS runner" >&2
            exit 1
          fi
          grep -F 'require active macOS MDM enrollment' "$inputs/guard"

  sign:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 85
    environment: mdm-release
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable tag checkout
        run: scripts/verify-release-ref.sh
      - name: Check for an existing signed artifact
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name == \"mdm-$GITHUB_REF_NAME\" and .expired == false) | .id")"
          if [[ -n "$artifact_ids" ]]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify published CLI inputs and combine architectures
        if: steps.existing.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          mkdir "$inputs" "$RUNNER_TEMP/mdm-artifact"
          for ((attempt=0; attempt<150; attempt++)); do
            draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
            if [[ "$draft" == false ]]; then break; fi
            sleep 30
          done
          [[ "$draft" == false ]] || { echo "Timed out waiting for Depot's published Go CLI release" >&2; exit 1; }
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$inputs" \
            --pattern release-manifest.json --pattern "doomer_${GITHUB_REF_NAME}_darwin_*.tar.gz"
          python3 scripts/prepare-mdm-release.py "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$inputs"
          bash mdm/combine-binaries.sh "$inputs"
      - name: Sign and verify the macOS installer
        if: steps.existing.outputs.reuse != 'true'
        env:
          MDM_INSTALLER_P12_BASE64: ${{ secrets.MDM_INSTALLER_P12_BASE64 }}
          MDM_INSTALLER_P12_PASSWORD: ${{ secrets.MDM_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          package="$RUNNER_TEMP/mdm-artifact/Doomer-MDM-$GITHUB_REF_NAME.pkg"
          bootstrap="$RUNNER_TEMP/mdm-artifact/Doomer-MDM-Bootstrap-$GITHUB_REF_NAME.pkg"
          mdm/sign-release-pkg.sh "$inputs/doomer" "$package" "$bootstrap"
      - name: Record installer provenance
        if: steps.existing.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/mdm-inputs"
          package="$RUNNER_TEMP/mdm-artifact/Doomer-MDM-$GITHUB_REF_NAME.pkg"
          bootstrap="$RUNNER_TEMP/mdm-artifact/Doomer-MDM-Bootstrap-$GITHUB_REF_NAME.pkg"
          python3 scripts/prepare-mdm-release.py "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "$inputs" \
            --record-package "$package" --bootstrap-package "$bootstrap"
      - name: Retain immutable installer for Depot
        if: steps.existing.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mdm-${{ github.ref_name }}
          path: ${{ runner.temp }}/mdm-artifact/
          if-no-files-found: error
          retention-days: 90

  verify-package-signature:
    needs: sign
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.sign.result == 'success') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Verify a published signed package
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          version=2026.11.19.1-beta.4
          package="$RUNNER_TEMP/Doomer-MDM-$version.pkg"
          curl --fail --silent --show-error --max-time 60 \
            "https://downloads.doomer.ai/cli/releases/$version/Doomer-MDM-$version.pkg" \
            -o "$package"
          printf '%s  %s\n' a7c6d6f36a10a7a568b4ec28b0fb4a4d4c598f8d1abf9dd3915f17e1621daf89 "$package" \
            | /usr/bin/shasum -a 256 -c -
          /usr/bin/sw_vers
          DOOMER_TEST_MDM_RUNTIME="$package" \
            DOOMER_TEST_MDM_SIGNER='Developer ID Installer: Marc Campbell (SVB2S5YXF4)' \
            go test -v ./cmd -run '^TestMDMRealPackageSignature$'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.event_name == 'push'
        with:
          name: mdm-${{ github.ref_name }}
          path: ${{ runner.temp }}/mdm-artifact
      - name: Verify the signed release packages
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/mdm-artifact"
          bootstrap="$artifacts/Doomer-MDM-Bootstrap-$GITHUB_REF_NAME.pkg"
          pkg="$artifacts/Doomer-MDM-$GITHUB_REF_NAME.pkg"
          expanded="$RUNNER_TEMP/expanded-bootstrap"
          /usr/sbin/pkgutil --expand-full "$bootstrap" "$expanded"
          identity="$(cat "$expanded/component.pkg/Payload/Library/DoomerMDM/installer-identity")"
          /usr/bin/sw_vers
          DOOMER_TEST_MDM_RUNTIME="$pkg" DOOMER_TEST_MDM_BOOTSTRAP="$bootstrap" \
            DOOMER_TEST_MDM_SIGNER="$identity" go test -v ./cmd -run '^TestMDMRealPackageSignature$'
