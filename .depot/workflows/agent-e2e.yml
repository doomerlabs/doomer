name: agent-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-e2e-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  selector-shadow:
    name: model selection experiment
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: agent-e2e
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Predict affected tests
        env:
          E2E_CONCENTRATE_API_KEY: ${{ secrets.E2E_CONCENTRATE_API_KEY }}
          SELECTOR_BASE: ${{ github.event.pull_request.base.sha }}
          SELECTOR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/agent-e2e-selector.py predict \
            --base "$SELECTOR_BASE" --head "$SELECTOR_HEAD" --output "$RUNNER_TEMP/e2e-selection"
      - name: Retain selection evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-selection-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-selection
          retention-days: 14

  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: agent-e2e
    outputs:
      scenarios: ${{ steps.scenarios.outputs.scenarios }}
      release: ${{ steps.scenarios.outputs.release }}
      cached: ${{ steps.cache.outputs.cached }}
      regression: ${{ steps.cache.outputs.regression }}
      cache_artifact_name: ${{ steps.scenarios.outputs.cache_artifact_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Discover all lifecycle scenarios
        id: scenarios
        run: |
          go run ./tests/codexinstall --scenario list > "$RUNNER_TEMP/e2e-scenarios.txt"
          python3 - "$RUNNER_TEMP/e2e-scenarios.txt" >> "$GITHUB_OUTPUT" <<'PY'
          import json, pathlib, re, sys, uuid
          scenarios = [line.strip() for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          if not scenarios or len(set(scenarios)) != len(scenarios):
              raise SystemExit("Scenario discovery returned an empty or duplicate list")
          if any(not re.fullmatch(r"[a-z0-9-]+", name) for name in scenarios):
              raise SystemExit("Scenario discovery returned an invalid name")
          print("scenarios=" + json.dumps(scenarios))
          print("cache_artifact_name=agent-e2e-cached-results-" + uuid.uuid4().hex)
          PY
          release=$(cat tests/codexinstall/baseline-release.txt)
          if [[ ! $release =~ ^20[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}\.[1-9][0-9]*$ ]]; then
            echo "Stable channel returned an unexpected Doomer release version" >&2
            exit 1
          fi
          printf 'release=%s\n' "$release" >> "$GITHUB_OUTPUT"

      - name: Verify signed shared results
        id: cache
        env:
          E2E_CANDIDATE_RELEASE: ${{ steps.scenarios.outputs.release }}
          E2E_R2_ACCOUNT_ID: ${{ secrets.E2E_R2_ACCOUNT_ID }}
          E2E_R2_BUCKET: ${{ secrets.E2E_R2_BUCKET }}
          E2E_R2_ACCESS_KEY_ID: ${{ secrets.E2E_R2_READ_ACCESS_KEY_ID }}
          E2E_R2_SECRET_ACCESS_KEY: ${{ secrets.E2E_R2_READ_SECRET_ACCESS_KEY }}
        run: |
          export E2E_BASELINE_SOURCE="$RUNNER_TEMP/e2e-baseline"
          scripts/agent-e2e-baseline.sh "$E2E_BASELINE_SOURCE"
          python3 scripts/agent-e2e-cache-plan.py --jobs 8 --output "$RUNNER_TEMP/e2e-cache"
      - name: Save verified cached recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.scenarios.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/e2e-cache/verified
          retention-days: 14

  lifecycle:
    needs: plan
    # Fork PRs never run credential-bearing jobs, even after manual run approval.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.harness }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    environment: agent-e2e
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Bound provider request bursts while keeping scenarios parallel.
      max-parallel: 8
      matrix:
        harness: [codex, claude]
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
        exclude:
          - harness: claude
            scenario: browser-onboarding
    env:
      E2E_CANDIDATE_RELEASE: ${{ needs.plan.outputs.release }}
      E2E_REPORT_DIR: /tmp/doomer-e2e-reports
    steps:
      - name: Accept verified cached result
        if: ${{ fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        run: |
          echo 'Signed result and artifacts verified in plan; no agent execution.'
          echo 'Result: verified shared-cache hit. Recording is in the combined gallery.' >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: ${{ !fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Run lifecycle scenario
        if: ${{ !fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        env:
          E2E_R2_ACCOUNT_ID: ${{ secrets.E2E_R2_ACCOUNT_ID }}
          E2E_R2_BUCKET: ${{ secrets.E2E_R2_BUCKET }}
          E2E_R2_ACCESS_KEY_ID: ${{ secrets.E2E_R2_WRITE_ACCESS_KEY_ID }}
          E2E_R2_SECRET_ACCESS_KEY: ${{ secrets.E2E_R2_WRITE_SECRET_ACCESS_KEY }}
          E2E_CACHE_SIGNING_KEY: ${{ secrets.E2E_CACHE_SIGNING_KEY }}
          E2E_CACHE_SIGNING_KEY_ID: ${{ secrets.E2E_CACHE_SIGNING_KEY_ID }}
          TEST_OPENAI_API_KEY: ${{ matrix.harness == 'codex' && secrets.TEST_OPENAI_API_KEY || '' }}
          TEST_CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.harness == 'claude' && secrets.TEST_CLAUDE_CODE_OAUTH_TOKEN || '' }}
          E2E_SCENARIO: ${{ matrix.scenario }}
          E2E_HARNESS: ${{ matrix.harness }}
          # Install the candidate skill through npx; the public package is released separately.
          E2E_NPX_SKILL_SOURCE: ${{ github.repository }}/.agents/skills/doomer-review#${{ github.head_ref || github.ref_name }}
        run: |
          report_root=$E2E_REPORT_DIR
          for attempt in 1 2; do
            export E2E_REPORT_DIR="$report_root/attempt-$attempt"
            if scripts/ci-agent-e2e.sh "$E2E_HARNESS" "$E2E_SCENARIO"; then
              status=0
              break
            else
              status=$?
            fi
            if [[ $attempt == 1 ]]; then
              echo "Scenario failed; retrying once with a fresh home."
            fi
          done
          # The gallery reads the final attempt; retain both attempts for debugging.
          if [[ -d $E2E_REPORT_DIR ]]; then
            cp -a "$E2E_REPORT_DIR/." "$report_root/"
          fi
          exit "$status"
      - name: Build recording index
        if: ${{ always() && !fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        env:
          E2E_SCENARIO: ${{ matrix.scenario }}
          E2E_HARNESS: ${{ matrix.harness }}
        run: GITHUB_STEP_SUMMARY='' python3 scripts/ci-agent-e2e-report.py --single "$E2E_REPORT_DIR" "$E2E_HARNESS" "$E2E_SCENARIO"
      - name: Save HTML recording and JSON result
        if: ${{ always() && !fromJSON(needs.plan.outputs.cached)[format('{0}/{1}', matrix.harness, matrix.scenario)] }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-${{ matrix.harness }}-${{ matrix.scenario }}
          path: ${{ env.E2E_REPORT_DIR }}
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  policy-regression:
    name: released CLI reproduces missing-policy regression
    needs: plan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: agent-e2e
    timeout-minutes: 40
    steps:
      - name: Accept verified regression witness
        if: needs.plan.outputs.regression == 'true'
        run: echo 'Signed result verifies the exact missing-policy failure and cleanup; no agent execution.'
      - if: needs.plan.outputs.regression != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check out released CLI baseline
        if: needs.plan.outputs.regression != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 83f551519b8dcbc0786f9d2817a7df87656c60ff # 2026.11.8.7, before policy recovery
          path: baseline
          persist-credentials: false
      - if: needs.plan.outputs.regression != 'true'
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Require the specific regression on the released CLI
        if: needs.plan.outputs.regression != 'true'
        env:
          E2E_R2_ACCOUNT_ID: ${{ secrets.E2E_R2_ACCOUNT_ID }}
          E2E_R2_BUCKET: ${{ secrets.E2E_R2_BUCKET }}
          E2E_R2_ACCESS_KEY_ID: ${{ secrets.E2E_R2_WRITE_ACCESS_KEY_ID }}
          E2E_R2_SECRET_ACCESS_KEY: ${{ secrets.E2E_R2_WRITE_SECRET_ACCESS_KEY }}
          E2E_CACHE_SIGNING_KEY: ${{ secrets.E2E_CACHE_SIGNING_KEY }}
          E2E_CACHE_SIGNING_KEY_ID: ${{ secrets.E2E_CACHE_SIGNING_KEY_ID }}
          TEST_OPENAI_API_KEY: ${{ secrets.TEST_OPENAI_API_KEY }}
          E2E_CANDIDATE_RELEASE: ${{ needs.plan.outputs.release }}
          E2E_CANDIDATE_SOURCE: ${{ github.workspace }}/baseline
          E2E_EXPECT_POLICY_REGRESSION: '1'
          E2E_REPORT_DIR: ${{ runner.temp }}/policy-baseline-reports
        run: scripts/ci-agent-e2e.sh codex policy-recovery
      - name: Save baseline failure evidence
        if: always() && needs.plan.outputs.regression != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: policy-regression-baseline
          path: ${{ runner.temp }}/policy-baseline-reports
          retention-days: 14
          if-no-files-found: error

  report:
    name: all lifecycle results
    needs: [plan, lifecycle, policy-regression]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      E2E_SCENARIOS: ${{ needs.plan.outputs.scenarios }}
      E2E_ARTIFACT_NAME: agent-e2e-all-recordings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Collect Codex scenario recordings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-e2e-codex-*
          path: e2e-artifacts
      - name: Collect Claude scenario recordings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: agent-e2e-claude-*
          path: e2e-artifacts
      # Download this plan attempt's verified reports last. Older scenario
      # artifacts from a rerun must not replace their cache-hit provenance.
      - name: Restore verified cached recordings
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.plan.outputs.cache_artifact_name }}
          path: e2e-artifacts
      - name: Summarize every scenario including failures
        if: always()
        run: python3 scripts/ci-agent-e2e-report.py --all e2e-artifacts
      - name: Save combined HTML recording gallery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-all-recordings
          path: e2e-artifacts
          retention-days: 14
          overwrite: true
          if-no-files-found: error

  selector-comparison:
    name: compare model selection with full results
    needs: [selector-shadow, report]
    if: always() && needs.selector-shadow.result == 'success' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-e2e-selection-${{ github.run_attempt }}
          path: e2e-selection
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-e2e-all-recordings
          path: e2e-results
      - name: Compare recommendation and observed failures
        run: |
          python3 scripts/agent-e2e-selector.py compare \
            --prediction e2e-selection/prediction.json --results e2e-results --output e2e-selection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-selection-comparison-${{ github.run_attempt }}
          path: e2e-selection
          retention-days: 14
