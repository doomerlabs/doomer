name: agent-e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: full lifecycle (${{ matrix.harness }})
    runs-on: ubuntu-24.04
    environment: agent-e2e
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        harness: [codex, claude]
    env:
      E2E_REPORT_DIR: ${{ github.workspace }}/e2e-reports/${{ matrix.harness }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: go.mod
      - name: Run every lifecycle scenario
        env:
          TEST_OPENAI_API_KEY: ${{ matrix.harness == 'codex' && secrets.TEST_OPENAI_API_KEY || '' }}
          TEST_CLAUDE_CODE_OAUTH_TOKEN: ${{ matrix.harness == 'claude' && secrets.TEST_CLAUDE_CODE_OAUTH_TOKEN || '' }}
        run: scripts/ci-agent-e2e.sh '${{ matrix.harness }}'
      - name: Build recording index
        if: always()
        run: GITHUB_STEP_SUMMARY= python3 scripts/ci-agent-e2e-report.py "$E2E_REPORT_DIR" '${{ matrix.harness }}'
      - name: Save HTML recordings and JSON results
        if: always()
        id: recordings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-e2e-${{ matrix.harness }}
          path: ${{ env.E2E_REPORT_DIR }}
          retention-days: 14
          if-no-files-found: error
      - name: Link recordings in job summary
        if: always()
        env:
          E2E_ARTIFACT_URL: ${{ steps.recordings.outputs.artifact-url }}
        run: python3 scripts/ci-agent-e2e-report.py "$E2E_REPORT_DIR" '${{ matrix.harness }}'
